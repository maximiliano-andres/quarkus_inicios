# Database
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=${DB_USERNAME}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=${MYSQL_URL}

# Hibernate
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false

# JWT Configuration
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION}
mp.jwt.verify.issuer=${JWT_ISSUER}
smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION}

# App Security (custom)
app.security.jwt.issuer=${JWT_ISSUER}
app.security.jwt.expiration=${JWT_EXPIRATION}

# Logging
quarkus.log.level=INFO
quarkus.log.category."ejemplo.quarkus".level=DEBUG